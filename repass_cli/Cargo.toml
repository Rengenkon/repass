[package]
name = "repass_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "repass"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
repass_generator = { version = "0.1.0", path = "../repass_generator" }
repass_storage = { version = "0.1.0", path = "../repass_storage" }
rpassword = "7.5.4"
shlex = "2.0.1"
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["alloc"] }
